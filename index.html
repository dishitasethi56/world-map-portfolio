(()=>{const entries={ux:["Art & Craft","Creative Corner","I enjoy hands-on creative work, including crocheting and craft activities.","Participated in a tote-bag making workshop and submitted 8 crochet bag-keychain creations for an exhibition, where they were sold.","Art and Craft · Crocheting"],graphic:["Graphics Volunteer","Graphics Grove","Selected as a graphics volunteer at The Literary Society & Psyched! at Mithibai College.","Showcased graphics work and contributed to social media posts for the society.","Graphic Designing"],art:["Cultural Head · Organica Club","Organica Club House","Cultural Head at Organica Club of VIS in Class XII, helping create a space where students learn life skills through fun and creative activities.","September 2025–March 2026: helped with club events including recipe-making; attended a tote-bag making workshop; submitted 8 crochet bag-keychain creations sold at an exhibition. Also painted diyas for an old-age home social contribution.","Creative Activities · Event Coordination"],contact:["Fine Arts Department · 1st Executive Member","Talent Search Fest","First Executive Member in the Fine Arts Department at the Annual Talent Search Fest.","July–August 2026: coordinated with different team members, understood requirements clearly and completed tasks within deadlines. I also hold experience in voluntary online peer counselling.","Team Coordination · Counselling Psychology"]};const world=document.querySelector("#world"),map=document.querySelector("#map"),panel=document.querySelector("#panel"),list=document.querySelector("#list"),items=document.querySelector("#listitems");let scale=1,dx=0,dy=0,drag=null;function render(){world.style.transform="translate("+dx+"px,"+dy+"px) scale("+scale+")"}function home(){scale=Math.min(map.clientWidth/1100,map.clientHeight/820);dx=(map.clientWidth-1100*scale)/2;dy=(map.clientHeight-820*scale)/2;render()}function show(id){const d=entries[id];if(!d)return;["cat","heading","desc","extra","skill"].forEach((k,i)=>document.getElementById(k).textContent=d[i]);panel.classList.add("open")}document.addEventListener("click",e=>{let b=e.target.closest("[data-id]");if(b){show(b.dataset.id);return}if(e.target.closest("#close"))panel.classList.remove("open");if(e.target.closest("#in")){scale=Math.min(1.6,scale*1.15);render()}if(e.target.closest("#out")){scale=Math.max(.35,scale/1.15);render()}if(e.target.closest("#home"))home();if(e.target.closest("#guide")){items.innerHTML=Object.entries(entries).map(([id,d])=>'<article><h3>'+d[0]+'</h3><p>'+d[2]+'</p><button data-open="'+id+'">Visit location</button></article>').join("");list.classList.add("open")}if(e.target.closest("#listclose"))list.classList.remove("open");b=e.target.closest("[data-open]");if(b){list.classList.remove("open");show(b.dataset.open)}});map.addEventListener("pointerdown",e=>{if(e.target.closest("button,.titlebox,.controls,.panel,.worldguide,.welcome"))return;drag={px:e.clientX,py:e.clientY,x:dx,y:dy};map.setPointerCapture?.(e.pointerId)});map.addEventListener("pointermove",e=>{if(!drag)return;dx=drag.x+e.clientX-drag.px;dy=drag.y+e.clientY-drag.py;render()});let end=()=>drag=null;map.addEventListener("pointerup",end);map.addEventListener("pointercancel",end);map.addEventListener("lostpointercapture",end);map.addEventListener("wheel",e=>{e.preventDefault();scale=Math.max(.35,Math.min(1.6,scale*(e.deltaY<0?1.1:.9)));render()},{passive:false});window.addEventListener("resize",home);window.addEventListener("keydown",e=>{if(e.key==="Escape"){panel.classList.remove("open");list.classList.remove("open")}});home()})();
